# Windows 실행 파일(sip-and-sort.exe) 빌드 및 배포
#
# - v로 시작하는 태그를 push 하면 (예: git tag v0.2.0 && git push origin v0.2.0)
#   exe 를 빌드해 GitHub Releases 에 올립니다.
# - Actions 탭에서 수동 실행하면 빌드만 하고, 결과물은 실행 기록의 Artifacts 에서 받을 수 있습니다.
# exe 에는 어떤 API 키/토큰도 들어가지 않습니다. 사용자는 실행 후 설정 페이지에서 본인 키를 등록합니다.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements-build.txt -e ".[dev]"

      - name: 테스트
        run: pytest -q

      - name: exe 빌드
        run: pyinstaller --noconfirm --clean packaging/sip-and-sort.spec

      - name: exe 동작 확인
        run: dist/sip-and-sort.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: sip-and-sort-windows
          path: dist/sip-and-sort.exe

      - name: GitHub Release 에 업로드
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/sip-and-sort.exe \
            --title "sip-and-sort $GITHUB_REF_NAME" \
            --notes "Windows용 sip-and-sort.exe 입니다. 다운로드 후 더블클릭하면 설정 페이지가 열립니다. 사용법은 README를 참고하세요. 이 프로그램은 메일을 자동 발송하지 않으며 Gmail 임시보관함에 초안만 저장합니다."
